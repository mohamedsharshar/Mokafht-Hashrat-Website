<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأسئلة الشائعة | مكافحة الحشرات والقوارض</title>
<meta name="description" content="الأسئلة الشائعة حول خدمات مكافحة الحشرات والقوارض. إجابات احترافية ونصائح فعالة لحماية منزلك.">
<link rel="icon" href="./imgs/pngegg (1).png">
<link rel="stylesheet" href="faq.css">
</head>
<body>

<div class="faq-main-container">
        <h1 class="faq-title">الأسئلة الشائعة</h1>
        <div class="faq-actions">
            <input type="text" id="faq-search" placeholder="ابحث في الأسئلة..." title="ابحث في الأسئلة" />
        </div>
        <div class="faq-container" id="faq-list">
            <!-- سيتم جلب الأسئلة ديناميكياً من الباك اند -->
        </div>
        <div id="no-results" class="hidden">لا توجد نتائج مطابقة.</div>
    </div>
    <script src="faq.js"></script>
    <script>
    // جلب الأسئلة من الباك اند وعرضها ديناميكياً
    document.addEventListener('DOMContentLoaded', function () {
        fetch('faq_backend.php?action=get_faqs')
            .then(res => res.json())
            .then(data => {
                const faqList = document.getElementById('faq-list');
                faqList.innerHTML = '';
                data.forEach((faq, idx) => {
                    const item = document.createElement('div');
                    item.className = 'faq-item';
                    item.innerHTML = `<div class='question' id='question${idx+1}'><span class='q-icon'>${idx+1}</span>${faq.question} <img src='./imgs/add.png' class='toggle-icon' alt='عرض الإجابة' title='عرض الإجابة'></div><div class='answer' id='answer${idx+1}'>${faq.answer}<button class='copy-answer' title='نسخ الإجابة'>نسخ الإجابة</button></div>`;
                    faqList.appendChild(item);
                });
                // تفعيل التفاعل (فتح/غلق/نسخ) بعد جلب الأسئلة
                if (typeof faqPageInteractions === 'function') faqPageInteractions();
            });
    });
    </script>
</body>
</html>
